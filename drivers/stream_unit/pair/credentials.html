<style>
  .ef-pair { padding: 16px; max-width: 460px; margin: 0 auto; font-family: inherit; }
  .ef-pair h2 { margin: 0 0 8px; }
  .ef-pair p.help { color: #888; font-size: 13px; margin: 0 0 16px; }
  .ef-pair label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 13px; }
  .ef-pair input, .ef-pair select {
    width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box;
  }
  .ef-pair button {
    margin-top: 20px; width: 100%; padding: 12px; border: 0; border-radius: 8px;
    background: #1aa3e8; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .ef-pair button:disabled { opacity: 0.6; cursor: default; }
  .ef-pair .err { color: #d23; font-size: 13px; margin-top: 12px; min-height: 18px; }
</style>

<div class="ef-pair">
  <h2>Connect your EcoFlow account</h2>
  <p class="help">
    Create an Access Key and Secret Key in the EcoFlow developer portal
    (developer.ecoflow.com &rarr; IoT Background), then paste them below.
  </p>

  <label for="ef-access">Access Key</label>
  <input id="ef-access" type="text" autocomplete="off" spellcheck="false" placeholder="Access Key" />

  <label for="ef-secret">Secret Key</label>
  <input id="ef-secret" type="password" autocomplete="off" spellcheck="false" placeholder="Secret Key" />

  <label for="ef-host">Region</label>
  <select id="ef-host">
    <option value="https://api.ecoflow.com">Global (api.ecoflow.com)</option>
    <option value="https://api-e.ecoflow.com">Europe (api-e.ecoflow.com)</option>
  </select>

  <button id="ef-next" type="button">Continue</button>
  <div class="err" id="ef-err"></div>
</div>

<script type="text/javascript">
  const btn = document.getElementById('ef-next');
  const err = document.getElementById('ef-err');

  btn.addEventListener('click', async function () {
    const accessKey = document.getElementById('ef-access').value.trim();
    const secretKey = document.getElementById('ef-secret').value.trim();
    const host = document.getElementById('ef-host').value;
    err.textContent = '';
    if (!accessKey || !secretKey) {
      err.textContent = 'Both the Access Key and Secret Key are required.';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Checking…';
    try {
      await Homey.emit('login', { accessKey: accessKey, secretKey: secretKey, host: host });
      Homey.showView('list_devices');
    } catch (e) {
      err.textContent = (e && e.message) ? e.message : 'Could not connect. Check your keys and region.';
      btn.disabled = false;
      btn.textContent = 'Continue';
    }
  });
</script>
