<style>
  .ef-pair { padding: 16px; max-width: 460px; margin: 0 auto; font-family: inherit; }
  .ef-pair h2 { margin: 0 0 8px; }
  .ef-pair p.help { color: #888; font-size: 13px; margin: 0 0 16px; }
  .ef-pair label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 13px; }
  .ef-pair input, .ef-pair select {
    width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box;
  }
  .ef-pair button {
    margin-top: 20px; width: 100%; padding: 12px; border: 0; border-radius: 8px;
    background: #1aa3e8; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .ef-pair button:disabled { opacity: 0.6; cursor: default; }
  .ef-pair .err { color: #d23; font-size: 13px; margin-top: 12px; min-height: 18px; }
  .ef-pair .muted { color: #888; font-size: 13px; text-align: center; }
</style>

<!-- Shown briefly while we check for a saved EcoFlow account. -->
<div class="ef-pair" id="ef-checking">
  <p class="muted" role="status">Checking your EcoFlow account&hellip;</p>
</div>

<!-- Only shown the first time, when no EcoFlow account is stored yet. -->
<div class="ef-pair" id="ef-form" style="display:none;">
  <h2 data-i18n="pair.stream_5000_solar.title">STREAM 5000 Solar</h2>
  <p class="help" data-i18n="pair.account">Use the email address and password you use in the EcoFlow app. Homey stores them in this integration’s settings and sends them to EcoFlow to sign in.</p>

  <label for="ef-email">EcoFlow account email</label>
  <input id="ef-email" type="email" autocomplete="off" spellcheck="false" placeholder="you@example.com" />

  <label for="ef-password">EcoFlow account password</label>
  <input id="ef-password" type="password" autocomplete="off" spellcheck="false" placeholder="Password" />

  <label for="ef-host">Region</label>
  <select id="ef-host">
    <option value="https://api.ecoflow.com">Global (api.ecoflow.com)</option>
    <option value="https://api-e.ecoflow.com">Europe (api-e.ecoflow.com)</option>
  </select>

  <button id="ef-next" type="button">Sign in</button>
  <div class="err" id="ef-err" role="alert" aria-atomic="true"></div>
</div>

<script type="text/javascript">
  // Configure-once: if an EcoFlow account is already stored, skip straight to
  // the device list. Only first-time onboarding shows the sign-in form.
  (function () {
    Homey.emit('check_app_credentials', null, function (err, hasCreds) {
      if (!err && hasCreds) {
        Homey.showView('list_devices');
        return;
      }
      document.getElementById('ef-checking').style.display = 'none';
      document.getElementById('ef-form').style.display = 'block';
    });
  })();

  var btn = document.getElementById('ef-next');
  var err = document.getElementById('ef-err');

  btn.addEventListener('click', function () {
    var email = document.getElementById('ef-email').value.trim();
    var password = document.getElementById('ef-password').value;
    var host = document.getElementById('ef-host').value;
    err.textContent = '';
    if (!email || !password) {
      err.textContent = 'Both the email address and the password are required.';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Signing in\u2026';
    Homey.emit('app_login', { email: email, password: password, host: host }, function (e) {
      // Clear the field as soon as it has been handed over.
      document.getElementById('ef-password').value = '';
      if (e) {
        err.textContent = (e && e.message) ? e.message : 'Could not sign in. Check your email, password and region.';
        btn.disabled = false;
        btn.textContent = 'Sign in';
        return;
      }
      Homey.showView('list_devices');
    });
  });
</script>
