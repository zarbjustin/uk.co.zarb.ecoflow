<style>
  .account-repair { padding:16px; max-width:480px; margin:auto; font:14px/1.5 -apple-system,system-ui,sans-serif; }
  .account-repair h2 { font-size:20px; }
  .account-repair label { display:block; margin-top:14px; }
  .account-repair input:not([type=checkbox]), .account-repair select, .account-repair button { box-sizing:border-box; width:100%; padding:10px; }
  .account-repair button { margin-top:16px; border:0; border-radius:8px; background:#1aa3e8; color:white; font:600 15px system-ui,sans-serif; }
  .account-repair button:disabled { opacity:.5; }
  .account-repair [hidden] { display:none; }
</style>
<div class="account-repair">
  <h2 id="title"></h2><p id="intro"></p>
  <form id="credentials">
    <label for="email" id="emailLabel"></label><input id="email" type="email" autocomplete="off" required>
    <label for="password" id="passwordLabel"></label><input id="password" type="password" autocomplete="off" required>
    <label for="host" id="regionLabel"></label><select id="host"><option value="https://api-e.ecoflow.com">Europe</option><option value="https://api.ecoflow.com">Global</option></select>
    <button id="login" type="submit"></button>
  </form>
  <div id="review" hidden>
    <p id="reviewText"></p><p id="affected"></p>
    <label><input id="consent" type="checkbox"><span id="consentText"></span></label>
    <button id="confirm" type="button" disabled></button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
</div>
<script type="text/javascript">
(function () {
  const el = id => document.getElementById(id);
  const text = key => Homey.__('app_account_repair.' + key);
  ['title', 'intro', 'emailLabel', 'passwordLabel', 'regionLabel', 'login', 'reviewText', 'consentText', 'confirm'].forEach(id => { el(id).textContent = text(id); });
  let generation = 0, token = null, expires = 0, timer = null, saving = false;
  function reset() {
    generation++; token = null; el('password').value = ''; el('consent').checked = false;
    el('confirm').disabled = true; el('review').hidden = true;
    if (timer) clearTimeout(timer); timer = null;
  }
  el('credentials').addEventListener('submit', async event => {
    event.preventDefault(); if (saving) return;
    const credentials = { email: el('email').value.trim(), password: el('password').value, host: el('host').value };
    reset(); const operation = generation; el('login').disabled = true;
    try {
      const result = await Homey.emit('app_account_repair_login', credentials);
      if (operation !== generation) return;
      if (!result || typeof result.token !== 'string' || !Number.isFinite(result.expiresAt) || result.expiresAt <= Date.now()) throw new Error('review');
      token = result.token; expires = result.expiresAt; el('review').hidden = false;
      el('affected').textContent = text('affected') + ' ' + result.affectedDevices;
      timer = setTimeout(() => { reset(); el('status').textContent = text('expired'); }, Math.min(90000, expires - Date.now()));
      el('status').textContent = '';
    } catch { if (operation === generation) el('status').textContent = text('failed'); }
    finally { credentials.password = ''; el('password').value = ''; el('login').disabled = false; }
  });
  el('consent').addEventListener('change', () => { el('confirm').disabled = !token || Date.now() >= expires || !el('consent').checked || saving; });
  el('confirm').addEventListener('click', async () => {
    if (!token || saving || Date.now() >= expires || !el('consent').checked) return;
    const operation = generation; saving = true; el('confirm').disabled = true; el('login').disabled = true;
    try {
      const result = await Homey.emit('app_account_repair_confirm', { token, accepted: true });
      if (operation !== generation) return;
      reset(); el('credentials').hidden = result?.saved === true;
      el('status').textContent = result?.saved === true ? text('saved') : text('failed');
    } catch { if (operation === generation) { reset(); el('status').textContent = text('failed'); } }
    finally { saving = false; el('login').disabled = false; }
  });
  window.addEventListener('pagehide', () => { reset(); Homey.emit('app_account_repair_cancel').catch(() => {}); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { reset(); Homey.emit('app_account_repair_cancel').catch(() => {}); } });
})();
</script>
