<style>
  .preview { padding:16px; max-width:460px; margin:auto; font:14px/1.5 -apple-system,system-ui,sans-serif; }
  .preview h2 { font-size:20px; }
  .preview label { display:block; margin-top:14px; }
  .preview input, .preview select, .preview button { box-sizing:border-box; width:100%; padding:10px; }
  .preview button { margin-top:20px; border:0; border-radius:8px; background:#1aa3e8; color:white; font:600 15px system-ui,sans-serif; }
</style>
<div class="preview">
  <h2 id="title"></h2><p id="privacy"></p>
  <label for="email">EcoFlow email</label><input id="email" type="email" autocomplete="off">
  <label for="password">EcoFlow password</label><input id="password" type="password" autocomplete="off">
  <label for="host">Region</label><select id="host"><option value="https://api-e.ecoflow.com">Europe</option><option value="https://api.ecoflow.com">Global</option></select>
  <button id="login"></button><p id="error" role="status"></p>
</div>
<script type="text/javascript">
  document.getElementById('title').textContent = Homey.__('dual_ct_preview.pair_title');
  document.getElementById('privacy').textContent = Homey.__('dual_ct_preview.pair_privacy');
  document.getElementById('login').textContent = Homey.__('dual_ct_preview.sign_in');
  document.getElementById('login').addEventListener('click', function() {
    var button = this; button.disabled = true;
    document.getElementById('error').textContent = '';
    Homey.emit('app_login', {email:document.getElementById('email').value.trim(),password:document.getElementById('password').value,host:document.getElementById('host').value}, function(error) {
      document.getElementById('password').value = '';
      if (error) { button.disabled = false; document.getElementById('error').textContent = Homey.__('dual_ct_preview.login_failed'); return; }
      Homey.showView('list_devices');
    });
  });
</script>
