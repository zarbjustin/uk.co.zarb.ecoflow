<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #EEF4F7; }
    .card { height: 226px; padding: 14px 16px; border-radius: 16px; background: #14242A; display: flex; flex-direction: column; gap: 12px; }
    .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .title { font-size: 13px; font-weight: 700; color: #DDE9EE; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tag { font-size: 11px; color: #9BB0B8; white-space: nowrap; }
    .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; flex: 1; align-content: center; }
    .metric { min-width: 0; }
    .label { font-size: 11px; color: #9BB0B8; text-transform: uppercase; letter-spacing: .4px; }
    .value { font-size: 21px; line-height: 1.15; font-weight: 750; margin-top: 3px; white-space: nowrap; }
    .solar { color: #F6CE48; }
    .home { color: #59C2FF; }
    .import { color: #FFB25B; }
    .export { color: #62D39A; }
    .bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
    .bar span { display: block; height: 100%; width: 0%; background: #62D39A; }
    .foot { font-size: 11px; color: #9BB0B8; text-align: center; min-height: 14px; }
    .muted { opacity: .55; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="head"><div class="title" id="title">Today’s Energy</div><div class="tag" id="tag">—</div></div>
    <div class="rows">
      <div class="metric"><div class="label">Solar</div><div class="value solar" id="solar">—</div></div>
      <div class="metric"><div class="label">Home (est.)</div><div class="value home" id="home">—</div></div>
      <div class="metric"><div class="label">Imported</div><div class="value import" id="imported">—</div></div>
      <div class="metric"><div class="label">Exported</div><div class="value export" id="exported">—</div></div>
    </div>
    <div class="bar"><span id="bar"></span></div>
    <div class="foot" id="foot"></div>
  </div>
  <script>
    function kwh(v) { return v == null ? '—' : v.toFixed(2) + ' kWh'; }
    function pct(v) { return v == null ? '—' : Math.round(v) + '%'; }
    function onHomeyReady(Homey) {
      const index = Number((Homey.getSettings() || {}).index) || 1;
      const deviceId = (Homey.getDeviceIds && Homey.getDeviceIds()[0]) || '';
      const selector = deviceId ? '&deviceId=' + encodeURIComponent(deviceId) : '';
      Homey.ready();
      async function refresh() {
        const d = await Homey.api('GET', '/?index=' + index + selector, {});
        if (!d || !d.ok) { document.getElementById('title').textContent = 'No STREAM system'; document.getElementById('card').classList.add('muted'); return; }
        document.getElementById('title').textContent = d.name || 'Today’s Energy';
        document.getElementById('solar').textContent = kwh(d.solarToday);
        document.getElementById('home').textContent = kwh(d.consumptionToday);
        document.getElementById('imported').textContent = kwh(d.gridImportToday);
        document.getElementById('exported').textContent = kwh(d.gridExportToday);
        document.getElementById('tag').textContent = pct(d.independence);
        document.getElementById('bar').style.width = (d.independence == null ? 0 : Math.max(0, Math.min(100, d.independence))) + '%';
        document.getElementById('foot').textContent = (d.co2Today == null ? '' : 'CO2 avoided ' + d.co2Today.toFixed(2) + ' kg · ') + 'Home use & independence estimated';
        document.getElementById('card').classList.toggle('muted', d.available === false);
      }
      var busy = false;
      function scheduledRefresh() {
        if (busy) return;
        busy = true;
        refresh().catch(function () {
          document.getElementById('title').textContent = 'STREAM data unavailable';
          document.getElementById('card').classList.add('muted');
        }).finally(function () { busy = false; });
      }
      scheduledRefresh();
      var timer = setInterval(scheduledRefresh, 30000);
      window.addEventListener('pagehide', function () { clearInterval(timer); });
    }
  </script>
</body>
</html>
