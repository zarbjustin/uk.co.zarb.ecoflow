<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #EAF2F8;
    }
    .card {
      background: #10222C;
      border-radius: 16px;
      padding: 14px 16px;
      height: 226px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .head { display: flex; align-items: center; justify-content: space-between; }
    .title { font-size: 13px; font-weight: 600; color: #cfe0ec; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .soc { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; }
    .soc .dot { width: 9px; height: 9px; border-radius: 50%; background: #38C172; }
    .flowline {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      min-height: 42px;
    }
    .node { text-align: center; min-width: 0; }
    .node .name { font-size: 10px; color: #9bb3c4; text-transform: uppercase; letter-spacing: .35px; }
    .node .power { font-size: 15px; font-weight: 800; margin-top: 2px; white-space: nowrap; }
    .arrow { color: #5F7482; font-size: 18px; font-weight: 800; }
    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
      gap: 10px;
    }
    .stat {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }
    .stat .label { font-size: 11px; color: #9bb3c4; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat .value { font-size: 20px; font-weight: 700; line-height: 1.1; }
    .stat .sub { font-size: 11px; color: #9bb3c4; min-height: 13px; }
    .import .value { color: #F5A623; }
    .solar .value { color: #F6CE48; }
    .home .value { color: #4FB8F0; }
    .battery .value { color: #38C172; }
    .muted { opacity: 0.55; }
    .foot { font-size: 11px; color: #9bb3c4; text-align: center; min-height: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="title" id="title">STREAM</div>
      <div class="soc" id="socWrap"><span class="dot" id="socDot"></span><span id="soc">—</span></div>
    </div>
    <div class="flowline">
      <div class="node"><div class="name">Solar</div><div class="power solar" id="flowSolar">—</div></div>
      <div class="arrow">→</div>
      <div class="node"><div class="name">Home</div><div class="power home" id="flowHome">—</div></div>
      <div class="arrow" id="gridArrow">↔</div>
      <div class="node"><div class="name">Grid</div><div class="power import" id="flowGrid">—</div></div>
    </div>
    <div class="grid">
      <div class="stat battery"><div class="label">Battery</div><div class="value" id="battery">—</div><div class="sub" id="batterySub"></div></div>
      <div class="stat import"><div class="label">Grid</div><div class="value" id="grid">—</div><div class="sub" id="gridSub"></div></div>
    </div>
    <div class="foot" id="foot"></div>
  </div>

  <script type="text/javascript">
    function fmtPower(w) {
      if (w === null || w === undefined) return '—';
      const a = Math.abs(w);
      if (a >= 100) return (w / 1000).toFixed(2) + ' kW';
      return Math.round(w) + ' W';
    }

    function onHomeyReady(Homey) {
      const settings = Homey.getSettings() || {};
      const index = Number(settings.index) || 1;
      Homey.ready();

      function set(id, text) { document.getElementById(id).textContent = text; }

      async function refresh() {
        try {
          const d = await Homey.api('GET', '/?index=' + index, {});
          if (!d || !d.ok) {
            set('title', 'No STREAM system found');
            return;
          }
          set('title', d.name || 'STREAM');

          // Grid: positive = importing, negative = exporting.
          set('grid', fmtPower(d.grid == null ? null : Math.abs(d.grid)));
          set('gridSub', d.grid == null ? '' : (d.grid < -5 ? 'exporting' : (d.grid > 5 ? 'importing' : '')));

          set('flowSolar', fmtPower(d.solar));
          set('flowHome', fmtPower(d.home));
          set('flowGrid', fmtPower(d.grid == null ? null : Math.abs(d.grid)));
          set('gridArrow', d.grid == null ? '↔' : (d.grid < -5 ? '←' : (d.grid > 5 ? '→' : '↔')));

          // Battery power magnitude + state.
          set('battery', fmtPower(d.battery == null ? null : Math.abs(d.battery)));
          const stateLabel = d.state ? d.state.charAt(0).toUpperCase() + d.state.slice(1) : '';
          set('batterySub', stateLabel);

          // SoC badge.
          set('soc', d.soc == null ? '—' : Math.round(d.soc) + '%');
          const dot = document.getElementById('socDot');
          dot.style.background = d.state === 'discharging' ? '#F5A623' : (d.state === 'idle' ? '#9bb3c4' : '#38C172');

          set('foot', d.solarToday == null ? '' : 'Solar today: ' + d.solarToday.toFixed(2) + ' kWh');

          document.querySelector('.card').classList.toggle('muted', d.available === false);
        } catch (e) {
          // keep last values on transient errors
        }
      }

      refresh();
      setInterval(refresh, 3000);
    }
  </script>
</body>
</html>
