<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #EAF2F8; }
    .card {
      background: linear-gradient(160deg, #123247 0%, #08151F 100%);
      border-radius: 16px; padding: 14px 16px; height: 226px;
      display: flex; align-items: center; gap: 16px;
    }
    .ring { position: relative; width: 128px; height: 128px; flex: 0 0 128px; }
    .ring svg { transform: rotate(-90deg); }
    .ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .ring .soc { font-size: 30px; font-weight: 800; line-height: 1; }
    .ring .state { font-size: 11px; color: #9bb3c4; margin-top: 3px; text-transform: capitalize; }
    .info { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .title { font-size: 13px; font-weight: 600; color: #cfe0ec; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rows { display: flex; flex-direction: column; gap: 6px; }
    .row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
    .row .k { color: #9bb3c4; display: flex; align-items: center; gap: 6px; }
    .row .v { font-weight: 700; }
    .swatch { width: 9px; height: 9px; border-radius: 2px; }
    .s-reserve { background: #F5A623; }
    .s-limit { background: #E0555A; }
    .mode { font-size: 11px; color: #9bb3c4; }
    .muted { opacity: 0.55; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="ring">
      <svg width="128" height="128" viewBox="0 0 128 128">
        <circle cx="64" cy="64" r="56" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="12" />
        <circle id="arcReserve" cx="64" cy="64" r="56" fill="none" stroke="#F5A623" stroke-width="12" stroke-linecap="round" stroke-dasharray="0 999" opacity="0.35" />
        <circle id="arcSoc" cx="64" cy="64" r="56" fill="none" stroke="#38C172" stroke-width="12" stroke-linecap="round" stroke-dasharray="0 999" />
      </svg>
      <div class="center">
        <div class="soc" id="soc">—</div>
        <div class="state" id="state"></div>
      </div>
    </div>
    <div class="info">
      <div class="title" id="title">STREAM</div>
      <div class="rows">
        <div class="row"><span class="k"><span class="swatch s-reserve"></span>Backup reserve</span><span class="v" id="reserve">—</span></div>
        <div class="row"><span class="k"><span class="swatch s-limit"></span>Discharge limit</span><span class="v" id="limit">—</span></div>
        <div class="row"><span class="k">Time to full/empty</span><span class="v" id="time">—</span></div>
      </div>
      <div class="mode" id="mode"></div>
    </div>
  </div>

  <script type="text/javascript">
    var C = 2 * Math.PI * 56;
    var MODES = { self_powered: 'Self-powered', ai: 'AI / Smart', scheduled: 'Scheduled', tou: 'Time-of-use' };

    function set(id, t) { document.getElementById(id).textContent = t; }
    function arc(id, pct) {
      var frac = Math.max(0, Math.min(100, pct || 0)) / 100;
      document.getElementById(id).setAttribute('stroke-dasharray', (C * frac) + ' ' + C);
    }
    function fmtMin(m) {
      if (m == null) return '—';
      if (m < 60) return Math.round(m) + ' min';
      return (m / 60).toFixed(1) + ' h';
    }

    function onHomeyReady(Homey) {
      Homey.ready();
      var busy = false;
      var deviceId = null;
      try { var ids = Homey.getDeviceIds(); if (ids && ids.length) deviceId = ids[0]; } catch (e) {}

      async function refresh() {
        if (busy) return;
        busy = true;
        try {
          var q = deviceId ? '/?id=' + encodeURIComponent(deviceId) : '/';
          var d = await Homey.api('GET', q, {});
          if (!d || !d.ok) { set('title', 'No STREAM system found'); return; }
          set('title', d.name || 'STREAM');
          set('soc', d.soc == null ? '—' : Math.round(d.soc) + '%');
          set('state', d.state ? d.state : '');
          arc('arcSoc', d.soc);
          arc('arcReserve', d.reserve);
          document.getElementById('arcSoc').setAttribute('stroke',
            d.state === 'discharging' ? '#F5A623' : (d.state === 'idle' ? '#9bb3c4' : '#38C172'));
          set('reserve', d.reserve == null ? '—' : Math.round(d.reserve) + '%');
          set('limit', d.dischargeLimit == null ? '—' : Math.round(d.dischargeLimit) + '%');
          var t = d.state === 'charging' ? ('Full in ' + fmtMin(d.chargeRemaining))
            : d.state === 'discharging' ? ('Empty in ' + fmtMin(d.dischargeRemaining))
            : '—';
          set('time', t);
          set('mode', (d.mode ? (MODES[d.mode] || d.mode) : '') + (d.soh != null ? ('  ·  Health ' + Math.round(d.soh) + '%') : ''));
          document.getElementById('card').classList.toggle('muted', d.available === false);
        } catch (e) { /* keep last values */ }
        finally { busy = false; }
      }

      refresh();
      var timer = setInterval(refresh, 3000);
      window.addEventListener('pagehide', function () { clearInterval(timer); });
    }
  </script>
</body>
</html>
